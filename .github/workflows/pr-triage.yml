name: PR triage

on:
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Merge base branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.base_ref }}"
          git merge --no-edit "origin/${{ github.base_ref }}"

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run change-triage
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          agent -p --force --trust --output-format text \
            "Use the change-triage subagent on this pull request. The diff is git diff origin/${{ github.base_ref }}...HEAD. Write the plan to docs/test-plans/${{ github.head_ref }}.md and print only the plan." \
            > plan.md

      # A push made with github.token starts no new workflow run.
      - name: Commit plan and push
        run: |
          git add "docs/test-plans/${{ github.head_ref }}.md"
          git commit -m "Add test plan for ${{ github.head_ref }}"
          git push

      - name: Comment plan on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file plan.md

  tests:
    if: github.event.action == 'labeled' && github.event.label.name == 'plan-approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Merge base branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.base_ref }}"
          git merge --no-edit "origin/${{ github.base_ref }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run change-triage tests
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          agent -p --force --trust --output-format text \
            "The plan is approved. Route each row to its specialist, write the tests, run them, and write the results file. Never change app code." \
            > results.md

      # A push made with github.token starts no new workflow run.
      - name: Commit tests and docs and push
        run: |
          git add --all -- ':!results.md'
          git commit -m "Add tests and results for ${{ github.head_ref }}"
          git push

      - name: Comment results on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file results.md
